{% extends 'base.html' %}
{% block title %}About MediFlow | Our Mission{% endblock %}
{% block body %}

<div id="about-root"></div>

{% verbatim %}
<script type="text/babel">
function AboutPage() {
    const [stats, setStats] = React.useState({ accuracy: 0, cases: 0, uptime: 0 });

    React.useEffect(() => {
        const targets = { accuracy: 98, cases: 100, uptime: 99.9 };
        const steps = 60; const duration = 2000;
        let step = 0;
        const timer = setInterval(() => {
            step++;
            const e = 1 - Math.pow(1 - Math.min(step / steps, 1), 3);
            setStats({
                accuracy: Math.round(targets.accuracy * e),
                cases:    Math.round(targets.cases    * e),
                uptime:   (targets.uptime * e).toFixed(1),
            });
            if (step >= steps) clearInterval(timer);
        }, duration / steps);
        return () => clearInterval(timer);
    }, []);

    const techStack = [
        { icon: 'fa-brain',        name: 'PyTorch',   desc: 'Deep learning framework powering our CNN models',   color: '#fb923c' },
        { icon: 'fa-server',       name: 'Django',    desc: 'Robust Python backend for secure data processing',  color: '#06d6a0' },
        { icon: 'fa-atom',         name: 'React',     desc: 'Dynamic, component-driven user interfaces',         color: '#38bdf8' },
        { icon: 'fa-shield-halved',name: 'Security',  desc: 'End-to-end encryption for all medical data',        color: '#8b5cf6' },
    ];

    return (
        <div>
            <header className="max-w-7xl mx-auto pt-20 px-6">
                <div className="grid lg:grid-cols-2 gap-16 items-center">
                    <div className="anim-slide-left">
                        <span className="badge badge-cyan mb-6">The Future of Care</span>
                        <h1 className="text-5xl lg:text-6xl font-black leading-tight mb-8" style={{fontFamily: 'Outfit, sans-serif'}}>
                            Bridging AI with<br/>
                            <span className="gradient-text">Human Health</span>
                        </h1>
                        <p className="text-lg text-slate-400 leading-relaxed mb-10 max-w-lg">
                            MediFlow was born from a simple idea: health awareness shouldn't be complicated.
                            We use cutting-edge neural networks to empower individuals with preliminary insights before they visit the clinic.
                        </p>
                        <div className="flex gap-4">
                            {[
                                { val: `${stats.accuracy}%`, label: 'Detection Accuracy' },
                                { val: `${stats.cases}k+`,   label: 'Clinical Cases'     },
                                { val: `${stats.uptime}%`,   label: 'Uptime'             },
                            ].map((s, i) => (
                                <div key={i} className="glass-card p-5 rounded-2xl flex-1 text-center" style={{cursor: 'default'}}>
                                    <h4 className="text-2xl font-black gradient-text">{s.val}</h4>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">{s.label}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="anim-slide-right anim-delay-200">
                        <div className="glass-card p-12 rounded-3xl relative overflow-hidden" style={{cursor: 'default'}}>
                            <div className="absolute inset-0 opacity-10"
                                 style={{backgroundImage: 'radial-gradient(#38bdf8 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
                            <div className="relative z-10">
                                <i className="fas fa-quote-left text-3xl mb-6" style={{color: 'rgba(56,189,248,0.4)'}}></i>
                                <p className="text-lg text-slate-300 italic leading-relaxed font-light">
                                    "At MediFlow, our goal is to empower individuals with early health awareness through intelligent technology.
                                    We provide a simple, accessible platform where users understand their health better by analyzing skin conditions,
                                    stress levels, and common symptoms."
                                </p>
                                <div className="mt-8 flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full flex items-center justify-center"
                                         style={{background: 'linear-gradient(135deg, #06d6a0, #38bdf8)'}}>
                                        <i className="fas fa-heartbeat text-white text-sm"></i>
                                    </div>
                                    <div>
                                        <p className="text-sm font-bold text-slate-200">MediFlow Team</p>
                                        <p className="text-xs text-slate-500">Health Awareness Platform</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <section className="max-w-7xl mx-auto py-24 px-6">
                <div className="text-center mb-16 anim-fade-in-up">
                    <span className="badge badge-violet mb-4">Under the Hood</span>
                    <h2 className="text-4xl font-bold mb-4" style={{fontFamily: 'Outfit, sans-serif'}}>Built with Modern Tech</h2>
                    <p className="text-slate-500 max-w-xl mx-auto">Our stack is carefully chosen for reliability, speed, and clinical accuracy.</p>
                </div>
                <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
                    {techStack.map((tech, i) => (
                        <div key={i} className={`glass-card p-8 text-center anim-fade-in-up anim-delay-${(i+2)*100}`} style={{cursor: 'default'}}>
                            <div className="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-6"
                                 style={{background: `${tech.color}15`}}>
                                <i className={`fas ${tech.icon} text-xl`} style={{color: tech.color}}></i>
                            </div>
                            <h3 className="text-lg font-bold text-slate-100 mb-2">{tech.name}</h3>
                            <p className="text-xs text-slate-500 leading-relaxed">{tech.desc}</p>
                        </div>
                    ))}
                </div>
            </section>
        </div>
    );
}

const aboutRoot = ReactDOM.createRoot(document.getElementById('about-root'));
aboutRoot.render(<AboutPage />);
</script>
{% endverbatim %}

{% endblock %}
