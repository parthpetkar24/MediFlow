{% extends 'base.html' %}
{% block title %}Disease Predictor | MediFlow{% endblock %}
{% block body %}

{{ all_symptoms|json_script:"symptoms-data" }}

{% if predicted_disease %}
<script id="prediction-data" type="application/json">
{
    "disease": "{{ predicted_disease }}",
    "confidence": {{ confidence }},
    "top_diseases": [{% for d in top_diseases %}{"name": "{{ d.name }}", "confidence": {{ d.confidence }}}{% if not forloop.last %},{% endif %}{% endfor %}]
}
</script>
{% endif %}

{% if disease_info %}
<script id="disease-info-data" type="application/json">
{
    "description": "{{ disease_info.description|escapejs }}",
    "medications": [{% for m in disease_info.medications %}"{{ m|escapejs }}"{% if not forloop.last %},{% endif %}{% endfor %}]
}
</script>
{% endif %}

<div id="disease-root"></div>

<form method="POST" id="disease-form" style="display:none;">
    {% csrf_token %}
    <div id="hiddenInputs"></div>
</form>

<!-- Extract Django-rendered booleans to JS before verbatim -->
<script>
    var _NEED_MORE = {{ need_more|yesno:"true,false,false" }};
</script>

{% verbatim %}
<script type="text/babel">
function DiseasePredictor() {
    const allSymptoms = JSON.parse(document.getElementById('symptoms-data').textContent) || [];
    const predEl      = document.getElementById('prediction-data');
    const prediction  = predEl ? JSON.parse(predEl.textContent) : null;
    const infoEl      = document.getElementById('disease-info-data');
    const diseaseInfo = infoEl ? JSON.parse(infoEl.textContent) : null;
    const needMore    = _NEED_MORE;

    const [selected, setSelected] = React.useState([]);
    const [search,   setSearch]   = React.useState('');
    const resultsRef = React.useRef(null);

    React.useEffect(() => {
        if (prediction && resultsRef.current) {
            setTimeout(() => resultsRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' }), 300);
        }
    }, [prediction]);

    const toggleSymptom = (symptom) => setSelected(prev =>
        prev.includes(symptom) ? prev.filter(s => s !== symptom) : [...prev, symptom]
    );

    const handleSubmit = () => {
        const form   = document.getElementById('disease-form');
        const hidden = document.getElementById('hiddenInputs');
        hidden.innerHTML = '';
        selected.forEach(s => {
            const input = document.createElement('input');
            input.type = 'hidden'; input.name = 'symptoms'; input.value = s;
            hidden.appendChild(input);
        });
        form.submit();
    };

    const filtered = allSymptoms.filter(s => s.toLowerCase().replace(/_/g, ' ').includes(search.toLowerCase()));

    return (
        <div>
            <header className="max-w-4xl mx-auto text-center py-12 px-6 anim-fade-in-up">
                <span className="badge badge-violet mb-4">AI Diagnostics</span>
                <h1 className="text-4xl lg:text-5xl font-black mb-4" style={{fontFamily: 'Outfit, sans-serif'}}>
                    Disease <span className="gradient-text">Predictor</span>
                </h1>
                <p className="text-slate-400 max-w-xl mx-auto">
                    Select your symptoms below to receive an AI-powered disease prediction with confidence scores.
                </p>
            </header>

            <main className="max-w-7xl mx-auto px-6 pb-20 grid lg:grid-cols-3 gap-10">
                {/* ── Symptom selector ── */}
                <div className="lg:col-span-2 anim-slide-left">
                    <div className="flex items-center justify-between mb-6">
                        <h2 className="text-xl font-bold text-slate-200">Select Symptoms</h2>
                        <span className="text-xs text-slate-500">{selected.length} selected</span>
                    </div>
                    <div className="relative mb-6">
                        <i className="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-600 text-sm"></i>
                        <input type="text" placeholder="Search symptoms..." value={search}
                               onChange={(e) => setSearch(e.target.value)} className="input-glass pl-11 py-3" />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 max-h-[520px] overflow-y-auto pr-2" style={{scrollbarWidth: 'thin'}}>
                        {filtered.map((symptom) => (
                            <div key={symptom}
                                 className={`symptom-card p-4 cursor-pointer flex items-center gap-3 ${selected.includes(symptom) ? 'selected' : ''}`}
                                 onClick={() => toggleSymptom(symptom)}>
                                <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 transition ${selected.includes(symptom) ? 'border-cyan-400 bg-cyan-400/20' : 'border-slate-700'}`}>
                                    {selected.includes(symptom) && <i className="fas fa-check text-[9px] text-cyan-400"></i>}
                                </div>
                                <span className="font-medium text-sm text-slate-300">
                                    {symptom.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}
                                </span>
                            </div>
                        ))}
                    </div>
                </div>

                {/* ── Analysis panel ── */}
                <aside className="sticky top-24 h-fit anim-slide-right anim-delay-200">
                    <div className="glass-card p-8 rounded-3xl" style={{cursor: 'default'}}>
                        <div className="flex items-center justify-between mb-6">
                            <h3 className="text-xl font-bold text-slate-100">Analysis Panel</h3>
                            <div className="w-3 h-3 rounded-full bg-cyan-400" style={{animation: 'pulseGlow 2s infinite'}}></div>
                        </div>
                        <div className="mb-6">
                            <p className="text-xs text-slate-500 mb-3 uppercase tracking-wider font-bold">Selected Symptoms</p>
                            <div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">
                                {selected.length === 0
                                    ? <span className="text-sm text-slate-600 italic">None selected</span>
                                    : selected.map(s => <span key={s} className="selected-chip text-xs">{s.replace(/_/g, ' ')}</span>)
                                }
                            </div>
                        </div>
                        <button onClick={handleSubmit} disabled={selected.length < 2}
                                className="btn-primary w-full py-4 rounded-xl font-bold text-sm disabled:opacity-30 disabled:cursor-not-allowed">
                            <span><i className="fas fa-microscope mr-2"></i>Analyze Symptoms ({selected.length})</span>
                        </button>
                        {selected.length < 2 && selected.length > 0 && (
                            <p className="text-xs text-amber-400/70 mt-2 text-center">Select at least 2 symptoms</p>
                        )}

                        {prediction && (
                            <div ref={resultsRef} className="mt-8 pt-6 border-t border-white/5">
                                <div className="flex items-center gap-2 mb-4">
                                    <div className="w-2 h-2 rounded-full bg-emerald-400"></div>
                                    <h3 className="font-bold text-lg text-slate-100">Prediction Result</h3>
                                </div>
                                <div className="glass-card p-4 rounded-xl mb-4" style={{cursor: 'default', background: 'rgba(6,214,160,0.06)'}}>
                                    <p className="text-xs text-slate-500 uppercase tracking-wider font-bold mb-1">Primary Diagnosis</p>
                                    <p className="text-xl font-black gradient-text">{prediction.disease}</p>
                                    <p className="text-sm text-slate-400 mt-1">Confidence: <span className="text-cyan-400 font-bold">{prediction.confidence}%</span></p>
                                </div>
                                <h4 className="font-bold text-sm text-slate-300 mb-3">Top Matches</h4>
                                {prediction.top_diseases.map((d, i) => (
                                    <div key={i} className="mb-3">
                                        <div className="flex justify-between text-sm mb-1">
                                            <span className="text-slate-300">{d.name}</span>
                                            <span className="text-slate-500">{d.confidence}%</span>
                                        </div>
                                        <div className="progress-bar-track h-2">
                                            <div className="progress-bar-fill h-2"
                                                 style={{width: `${d.confidence}%`, background: i === 0 ? 'linear-gradient(90deg, #06d6a0, #38bdf8)' : 'rgba(148,163,184,0.3)'}}>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                                <div className="mt-4 p-3 rounded-xl text-xs text-sky-300/70 font-medium text-center"
                                     style={{background: 'rgba(56,189,248,0.06)', border: '1px solid rgba(56,189,248,0.1)'}}>
                                    <i className="fas fa-circle-info mr-1"></i>
                                    AI prediction only — consult a doctor for diagnosis.
                                </div>
                            </div>
                        )}

                        {needMore && (
                            <div className="mt-6 p-3 rounded-xl text-sm font-bold text-center"
                                 style={{background: 'rgba(244,63,94,0.08)', border: '1px solid rgba(244,63,94,0.15)', color: '#f87171'}}>
                                <i className="fas fa-triangle-exclamation mr-2"></i>
                                Please provide more symptom details
                            </div>
                        )}
                    </div>

                    {/* ── Disease Info Card (description + remedies) ── */}
                    {diseaseInfo && (
                        <div className="glass-card p-8 rounded-3xl mt-6 anim-fade-in-up" style={{cursor: 'default'}}>
                            <div className="flex items-center gap-3 mb-5">
                                <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
                                     style={{background: 'rgba(129,140,248,0.15)'}}>
                                    <i className="fas fa-book-medical text-indigo-400"></i>
                                </div>
                                <h3 className="text-lg font-bold text-slate-100">About This Condition</h3>
                            </div>

                            {/* Description */}
                            <p className="text-sm text-slate-400 leading-relaxed mb-6">
                                {diseaseInfo.description}
                            </p>

                            {/* Remedies */}
                            {diseaseInfo.medications.length > 0 && (
                                <div>
                                    <p className="text-xs text-slate-500 uppercase tracking-wider font-bold mb-3">
                                        <i className="fas fa-pills mr-1.5 text-violet-400"></i>
                                        Suggested Remedies
                                    </p>
                                    <div className="space-y-2">
                                        {diseaseInfo.medications.map((med, i) => (
                                            <div key={i} className="flex items-start gap-3 p-3 rounded-xl"
                                                 style={{background: 'rgba(129,140,248,0.06)', border: '1px solid rgba(129,140,248,0.1)'}}>
                                                <span className="w-5 h-5 rounded-lg flex items-center justify-center flex-shrink-0 mt-0.5 text-[10px] font-bold text-indigo-300"
                                                      style={{background: 'rgba(129,140,248,0.15)'}}>
                                                    {i + 1}
                                                </span>
                                                <span className="text-sm text-slate-300">{med}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <p className="text-xs text-slate-600 mt-4 text-center italic">
                                        Always follow a licensed physician's guidance before taking any medication.
                                    </p>
                                </div>
                            )}
                        </div>
                    )}
                </aside>
            </main>
        </div>
    );
}

const diseaseRoot = ReactDOM.createRoot(document.getElementById('disease-root'));
diseaseRoot.render(<DiseasePredictor />);
</script>
{% endverbatim %}

{% endblock %}
