{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join MediFlow | Secure Health Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mesh-bg">
        <div class="mesh-orb mesh-orb-1"></div>
        <div class="mesh-orb mesh-orb-2"></div>
        <div class="mesh-orb mesh-orb-3"></div>
    </div>

    <script>
        var _URLS = {
            index: "{% url 'index' %}",
            start: "{% url 'get_started' %}",
        };
    </script>

    <div id="signup-root" class="min-h-screen flex flex-col"></div>

    {% verbatim %}
    <script type="text/babel">
    function SignupPage() {
        const [formData,     setFormData]     = React.useState({ name: '', email: '', password: '' });
        const [agreed,       setAgreed]       = React.useState(false);
        const [focusedField, setFocusedField] = React.useState(null);

        const handleChange = (field, value) => setFormData(prev => ({...prev, [field]: value}));

        return (
            <div className="min-h-screen flex flex-col">
                <nav className="p-8">
                    <a href={_URLS.index} className="flex items-center gap-3 no-underline">
                        <div className="w-10 h-10 rounded-xl flex items-center justify-center"
                             style={{background: 'linear-gradient(135deg, #06d6a0, #38bdf8)'}}>
                            <i className="fas fa-heartbeat text-white text-lg"></i>
                        </div>
                        <span className="logo-text text-xl">MediFlow</span>
                    </a>
                </nav>

                <main className="flex-grow flex items-center justify-center px-6 pb-12">
                    <div className="w-full max-w-lg">
                        <div className="glass-card p-10 lg:p-12 rounded-3xl anim-fade-in-up" style={{cursor: 'default'}}>
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5"
                                     style={{background: 'linear-gradient(135deg, rgba(6,214,160,0.15), rgba(56,189,248,0.15))'}}>
                                    <i className="fas fa-user-plus text-xl gradient-text"></i>
                                </div>
                                <h1 className="text-3xl font-black text-slate-100" style={{fontFamily: 'Outfit, sans-serif'}}>Create Account</h1>
                                <p className="text-sm text-slate-500 mt-2">Begin your AI-powered health journey</p>
                            </div>

                            <form action="#" className="space-y-5">
                                {[
                                    { field: 'name',     label: 'Full Name',       type: 'text',     placeholder: 'John Doe',       icon: 'fa-user'     },
                                    { field: 'email',    label: 'Email Address',   type: 'email',    placeholder: 'john@email.com', icon: 'fa-envelope' },
                                    { field: 'password', label: 'Password',        type: 'password', placeholder: '••••••••',       icon: 'fa-lock'     },
                                ].map((input, i) => (
                                    <div key={i}>
                                        <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">{input.label}</label>
                                        <div className="relative mt-2">
                                            <i className={`fas ${input.icon} absolute left-4 top-1/2 -translate-y-1/2 text-sm ${focusedField === input.field ? 'text-cyan-400' : 'text-slate-600'} transition`}></i>
                                            <input type={input.type} placeholder={input.placeholder} value={formData[input.field]}
                                                   onChange={(e) => handleChange(input.field, e.target.value)}
                                                   onFocus={() => setFocusedField(input.field)}
                                                   onBlur={() => setFocusedField(null)}
                                                   className="input-glass pl-11" />
                                        </div>
                                    </div>
                                ))}

                                <div className="flex items-center gap-3 py-2">
                                    <input type="checkbox" checked={agreed} onChange={() => setAgreed(!agreed)}
                                           className="w-4 h-4 rounded" style={{accentColor: '#06d6a0'}} />
                                    <span className="text-[11px] text-slate-500 leading-tight">
                                        I agree to the <a href="#" className="text-cyan-400 underline">Privacy Policy</a> regarding medical data encryption.
                                    </span>
                                </div>

                                <button type="submit" className="btn-primary w-full py-4 rounded-2xl text-base"
                                        style={{opacity: agreed ? 1 : 0.5, pointerEvents: agreed ? 'auto' : 'none'}}>
                                    <span>Create My Health Profile</span>
                                </button>
                            </form>

                            <div className="relative my-8">
                                <div className="gradient-divider"></div>
                                <div className="relative flex justify-center -mt-3">
                                    <span className="px-4 text-[10px] font-bold uppercase tracking-widest text-slate-600"
                                          style={{background: 'var(--bg-card)'}}>Or continue with</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <button className="glass-card flex items-center justify-center gap-2 py-3 rounded-xl hover:border-cyan-400/30 transition" style={{cursor: 'pointer'}}>
                                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-4 h-4" alt="Google" />
                                    <span className="text-xs font-bold text-slate-400">Google</span>
                                </button>
                                <button className="glass-card flex items-center justify-center gap-2 py-3 rounded-xl hover:border-cyan-400/30 transition" style={{cursor: 'pointer'}}>
                                    <i className="fab fa-apple text-lg text-slate-400"></i>
                                    <span className="text-xs font-bold text-slate-400">Apple</span>
                                </button>
                            </div>

                            <p className="text-center text-xs text-slate-600 mt-8">
                                Already have an account? <a href="#" className="text-cyan-400 font-bold no-underline hover:underline">Sign In</a>
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    }

    const signupRoot = ReactDOM.createRoot(document.getElementById('signup-root'));
    signupRoot.render(<SignupPage />);
    </script>
    {% endverbatim %}
</body>
</html>
