{% extends 'base.html' %}
{% block title %}Home | MediFlow — AI Health Platform{% endblock %}
{% block body %}

<div id="home-root"></div>

{% verbatim %}
<script type="text/babel">
function HomePage() {
    const [counters, setCounters] = React.useState({ accuracy: 0, users: 0, models: 0 });

    React.useEffect(() => {
        const targets = { accuracy: 98, users: 100, models: 3 };
        const steps = 60; const duration = 2000;
        let step = 0;
        const timer = setInterval(() => {
            step++;
            const eased = 1 - Math.pow(1 - Math.min(step / steps, 1), 3);
            setCounters({
                accuracy: Math.round(targets.accuracy * eased),
                users:    Math.round(targets.users    * eased),
                models:   Math.round(targets.models   * eased),
            });
            if (step >= steps) clearInterval(timer);
        }, duration / steps);
        return () => clearInterval(timer);
    }, []);

    return (
        <div>
            <section className="max-w-7xl mx-auto py-20 lg:py-28 px-6 grid lg:grid-cols-2 gap-16 items-center">
                <div className="anim-slide-left">
                    <span className="badge badge-cyan mb-6">AI-Powered Preventative Care</span>
                    <h1 className="text-5xl lg:text-7xl font-black leading-tight mb-6" style={{fontFamily: 'Outfit, sans-serif'}}>
                        Smart Health<br/>
                        <span className="gradient-text">Starts Here</span>
                    </h1>
                    <p className="text-lg text-slate-400 leading-relaxed mb-10 max-w-lg">
                        MediFlow leverages advanced neural networks to provide early awareness of potential health issues.
                        From skin analysis to stress tracking, your clinical-grade wellness companion is now digital.
                    </p>
                    <div className="flex items-center gap-4 flex-wrap">
                        <a href={_URLS.start} className="btn-primary px-8 py-4 rounded-xl no-underline inline-flex items-center gap-2">
                            <span>Get Started</span><i className="fas fa-arrow-right"></i>
                        </a>
                        <a href={_URLS.about} className="btn-ghost px-8 py-4 rounded-xl no-underline">Learn More</a>
                    </div>
                </div>

                <div className="anim-slide-right anim-delay-200 relative">
                    <div className="glass-card p-8 rounded-3xl relative overflow-hidden"
                         style={{background: 'linear-gradient(145deg, rgba(15,23,42,0.9), rgba(6,8,15,0.9))'}}>
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-3 h-3 bg-emerald-400 rounded-full" style={{animation: 'pulseGlow 2s infinite'}}></div>
                                <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Live Monitor</span>
                            </div>
                            <span className="text-xs text-slate-600">124 bpm</span>
                        </div>
                        <svg viewBox="0 0 400 150" className="w-full" style={{filter: 'drop-shadow(0 0 8px rgba(6,214,160,0.4))'}}>
                            <defs>
                                <linearGradient id="ekg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%"   stopColor="#06d6a0"/>
                                    <stop offset="50%"  stopColor="#38bdf8"/>
                                    <stop offset="100%" stopColor="#8b5cf6"/>
                                </linearGradient>
                            </defs>
                            <path d="M0 75 L60 75 L80 75 L90 30 L100 120 L110 55 L120 75 L200 75 L220 75 L230 25 L240 125 L250 50 L260 75 L400 75"
                                  fill="none" stroke="url(#ekg-grad)" strokeWidth="3" strokeLinecap="round"/>
                        </svg>
                        <div className="grid grid-cols-3 gap-4 mt-8">
                            {[
                                { val: `${counters.accuracy}%`, label: 'Accuracy'  },
                                { val: `${counters.users}k+`,   label: 'Analyses'  },
                                { val: `${counters.models}`,    label: 'AI Models' },
                            ].map((s, i) => (
                                <div key={i} className="text-center p-3 rounded-xl" style={{background: 'rgba(255,255,255,0.04)'}}>
                                    <p className="text-2xl font-black gradient-text">{s.val}</p>
                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">{s.label}</p>
                                </div>
                            ))}
                        </div>
                        <div className="absolute top-4 right-4">
                            <div className="w-8 h-8 rounded-full flex items-center justify-center"
                                 style={{background: 'rgba(6,214,160,0.15)'}}>
                                <i className="fas fa-heart text-emerald-400 text-xs"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section className="max-w-7xl mx-auto py-20 px-6">
                <div className="text-center mb-16 anim-fade-in-up">
                    <span className="badge badge-violet mb-4">How It Works</span>
                    <h2 className="text-4xl font-bold mb-4" style={{fontFamily: 'Outfit, sans-serif'}}>Three Simple Steps</h2>
                    <p className="text-slate-500 max-w-xl mx-auto">From input to insight in seconds. Our AI pipeline processes your data through clinically-validated models.</p>
                </div>
                <div className="grid md:grid-cols-3 gap-8">
                    {[
                        { step: '01', icon: 'fa-upload',     title: 'Input Data',   desc: 'Upload an image, select symptoms, or answer assessment questions.',                             color: '#06d6a0' },
                        { step: '02', icon: 'fa-microchip',  title: 'AI Analysis',  desc: 'Our neural networks process your data through multiple validation layers.',                    color: '#38bdf8' },
                        { step: '03', icon: 'fa-chart-line', title: 'Get Insights', desc: 'Receive detailed predictions with confidence scores and actionable recommendations.',          color: '#8b5cf6' },
                    ].map((item, i) => (
                        <div key={i} className={`glass-card p-8 text-center anim-fade-in-up anim-delay-${(i+2)*100}`}>
                            <div className="text-5xl font-black mb-4" style={{color: item.color, opacity: 0.2}}>{item.step}</div>
                            <div className="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-6"
                                 style={{background: `${item.color}15`}}>
                                <i className={`fas ${item.icon} text-xl`} style={{color: item.color}}></i>
                            </div>
                            <h3 className="text-xl font-bold mb-3 text-slate-100">{item.title}</h3>
                            <p className="text-sm text-slate-500 leading-relaxed">{item.desc}</p>
                        </div>
                    ))}
                </div>
            </section>

            <section className="max-w-7xl mx-auto py-20 px-6">
                <div className="text-center mb-16 anim-fade-in-up">
                    <span className="badge badge-blue mb-4">Core Modules</span>
                    <h2 className="text-4xl font-bold mb-4" style={{fontFamily: 'Outfit, sans-serif'}}>Precision Intelligence</h2>
                    <p className="text-slate-500 max-w-2xl mx-auto">Three core pillars of our health awareness engine, designed for accuracy and ease of use.</p>
                </div>
                <div className="grid md:grid-cols-3 gap-8">
                    <div className="feature-card p-8 anim-fade-in-up anim-delay-200">
                        <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-6" style={{background: 'rgba(56,189,248,0.1)'}}>
                            <i className="fas fa-microscope text-lg text-sky-400"></i>
                        </div>
                        <h3 className="text-xl font-bold mb-3 text-slate-100">Skin Disease Detection</h3>
                        <p className="text-sm text-slate-500 leading-relaxed mb-6">Analyze moles, rashes, and irregularities using computer vision trained on millions of samples.</p>
                        <a href={_URLS.skin} className="text-cyan-400 font-bold text-sm no-underline hover:underline inline-flex items-center gap-2">
                            Try Analysis <i className="fas fa-arrow-right text-xs"></i>
                        </a>
                    </div>
                    <div className="feature-card p-8 anim-fade-in-up anim-delay-400">
                        <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-6" style={{background: 'rgba(251,146,60,0.1)'}}>
                            <i className="fas fa-brain text-lg text-orange-400"></i>
                        </div>
                        <h3 className="text-xl font-bold mb-3 text-slate-100">Stress Analyzer</h3>
                        <p className="text-sm text-slate-500 leading-relaxed mb-6">Quantify your mental fatigue and cortisol indicators through biometric patterns and behavioral analysis.</p>
                        <a href={_URLS.stress} className="text-orange-400 font-bold text-sm no-underline hover:underline inline-flex items-center gap-2">
                            Check Stress <i className="fas fa-arrow-right text-xs"></i>
                        </a>
                    </div>
                    <div className="feature-card p-8 anim-fade-in-up anim-delay-600">
                        <div className="w-12 h-12 rounded-2xl flex items-center justify-center mb-6" style={{background: 'rgba(139,92,246,0.1)'}}>
                            <i className="fas fa-notes-medical text-lg text-violet-400"></i>
                        </div>
                        <h3 className="text-xl font-bold mb-3 text-slate-100">Disease Predictor</h3>
                        <p className="text-sm text-slate-500 leading-relaxed mb-6">Input your lifestyle data to receive a probabilistic overview of potential health risks before they become issues.</p>
                        <a href={_URLS.disease} className="text-violet-400 font-bold text-sm no-underline hover:underline inline-flex items-center gap-2">
                            Predict Now <i className="fas fa-arrow-right text-xs"></i>
                        </a>
                    </div>
                </div>
            </section>

            <section className="max-w-7xl mx-auto py-20 px-6">
                <div className="glass-card p-12 lg:p-16 text-center rounded-3xl relative overflow-hidden anim-fade-in-up">
                    <div className="absolute inset-0 opacity-10"
                         style={{backgroundImage: 'radial-gradient(circle at 30% 50%, #06d6a0, transparent 50%), radial-gradient(circle at 70% 50%, #8b5cf6, transparent 50%)'}}>
                    </div>
                    <div className="relative z-10">
                        <h2 className="text-4xl lg:text-5xl font-black mb-6" style={{fontFamily: 'Outfit, sans-serif'}}>
                            Ready for <span className="gradient-text">Smarter Health?</span>
                        </h2>
                        <p className="text-slate-400 text-lg max-w-2xl mx-auto mb-10">
                            Join thousands of users leveraging AI for proactive health awareness. Start your analysis now.
                        </p>
                        <a href={_URLS.start} className="btn-primary px-10 py-4 rounded-xl text-lg no-underline inline-flex items-center gap-3">
                            <span>Launch Platform</span><i className="fas fa-rocket"></i>
                        </a>
                    </div>
                </div>
            </section>
        </div>
    );
}

const homeRoot = ReactDOM.createRoot(document.getElementById('home-root'));
homeRoot.render(<HomePage />);
</script>
{% endverbatim %}

{% endblock %}
