{% extends 'base.html' %}
{% block title %}Get Started | MediFlow AI{% endblock %}
{% block body %}

<div id="getstarted-root"></div>

{% verbatim %}
<script type="text/babel">
function GetStartedPage() {
    const tools = [
        { name: 'Skin Detection',   icon: 'fa-camera',        url: _URLS.skin,    color: '#38bdf8', gradient: 'linear-gradient(135deg, rgba(56,189,248,0.15), rgba(56,189,248,0.02))',   desc: 'Upload photos for instant analysis of moles, rashes, and other dermatological conditions using our CNN model.'       },
        { name: 'Stress Analyzer',  icon: 'fa-brain',         url: _URLS.stress,  color: '#fb923c', gradient: 'linear-gradient(135deg, rgba(251,146,60,0.15), rgba(251,146,60,0.02))',   desc: 'Analyze behavioral patterns and self-reported biometrics to quantify cognitive load and cortisol risk.'             },
        { name: 'Disease Predictor',icon: 'fa-notes-medical', url: _URLS.disease, color: '#8b5cf6', gradient: 'linear-gradient(135deg, rgba(139,92,246,0.15), rgba(139,92,246,0.02))',   desc: 'Input symptoms and lifestyle data for probabilistic health risk assessments powered by machine learning.'           },
    ];

    return (
        <main className="max-w-7xl mx-auto px-6 py-20">
            <div className="text-center mb-20 anim-fade-in-up">
                <span className="badge badge-cyan mb-6">Selection Portal</span>
                <h1 className="text-5xl lg:text-6xl font-black mb-6" style={{fontFamily: 'Outfit, sans-serif'}}>
                    Choose Your <span className="gradient-text">Analysis</span>
                </h1>
                <p className="text-slate-400 max-w-2xl mx-auto text-lg leading-relaxed">
                    Select the AI tool you wish to use. Each module is specifically trained for clinical awareness and precision.
                </p>
            </div>

            <div className="grid md:grid-cols-3 gap-10">
                {tools.map((tool, i) => (
                    <a key={i} href={tool.url}
                       className={`tool-card group p-10 flex flex-col items-center text-center no-underline anim-fade-in-up anim-delay-${(i+2)*100}`}
                       style={{background: tool.gradient}}>
                        <div className="w-20 h-20 rounded-3xl flex items-center justify-center mb-8 text-3xl transition-all duration-300 group-hover:scale-110"
                             style={{background: `${tool.color}15`, color: tool.color}}>
                            <i className={`fas ${tool.icon}`}></i>
                        </div>
                        <h3 className="text-2xl font-bold text-slate-100 mb-4">{tool.name}</h3>
                        <p className="text-sm text-slate-500 leading-relaxed mb-8">{tool.desc}</p>
                        <span className="mt-auto inline-flex items-center gap-2 font-bold transition-all duration-300 group-hover:gap-4"
                              style={{color: tool.color}}>
                            Open Tool <i className="fas fa-arrow-right"></i>
                        </span>
                    </a>
                ))}
            </div>

            <div className="grid grid-cols-3 gap-6 mt-20 anim-fade-in-up anim-delay-700">
                {[
                    { label: 'Response Time', value: '<2s',  icon: 'fa-bolt'     },
                    { label: 'Models Active', value: '3',    icon: 'fa-microchip'},
                    { label: 'Data Encrypted',value: '100%', icon: 'fa-lock'     },
                ].map((stat, i) => (
                    <div key={i} className="glass-card p-6 text-center rounded-2xl" style={{cursor: 'default'}}>
                        <i className={`fas ${stat.icon} text-slate-600 mb-3 text-lg`}></i>
                        <p className="text-2xl font-black gradient-text">{stat.value}</p>
                        <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">{stat.label}</p>
                    </div>
                ))}
            </div>
        </main>
    );
}

const gsRoot = ReactDOM.createRoot(document.getElementById('getstarted-root'));
gsRoot.render(<GetStartedPage />);
</script>
{% endverbatim %}

{% endblock %}
