{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | MediFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mesh-bg">
        <div class="mesh-orb mesh-orb-1"></div>
        <div class="mesh-orb mesh-orb-2"></div>
        <div class="mesh-orb mesh-orb-3"></div>
    </div>

    <script>
        var _URLS   = { index: "{% url 'index' %}", signup: "{% url 'signup' %}" };
        var _CSRF   = "{{ csrf_token }}";
        var _MSG    = [{% for m in messages %}"{{ m }}"{% if not forloop.last %},{% endif %}{% endfor %}];
        var _IS_ERR = [{% for m in messages %}"{{ m.tags }}"{% if not forloop.last %},{% endif %}{% endfor %}];
    </script>

    <div id="login-root" class="min-h-screen flex flex-col"></div>

    {% verbatim %}
    <script type="text/babel">
    function LoginPage() {
        const [focusedField, setFocusedField] = React.useState(null);
        const [showPass,     setShowPass]     = React.useState(false);

        const hasError   = _IS_ERR.some(t => t.includes('error'));
        const hasSuccess = _IS_ERR.some(t => t.includes('success'));

        return (
            <div className="min-h-screen flex flex-col">
                <nav className="p-8">
                    <a href={_URLS.index} className="flex items-center gap-3 no-underline">
                        <div className="w-10 h-10 rounded-xl flex items-center justify-center"
                             style={{background: 'linear-gradient(135deg, #06d6a0, #38bdf8)'}}>
                            <i className="fas fa-heartbeat text-white text-lg"></i>
                        </div>
                        <span className="logo-text text-xl">MediFlow</span>
                    </a>
                </nav>

                <main className="flex-grow flex items-center justify-center px-6 pb-12">
                    <div className="w-full max-w-lg">
                        <div className="glass-card p-10 lg:p-12 rounded-3xl anim-fade-in-up">

                            {/* Messages */}
                            {_MSG.length > 0 && (
                                <div className="mb-6 p-4 rounded-2xl"
                                     style={{
                                         background: hasError ? 'rgba(244,63,94,0.1)' : 'rgba(6,214,160,0.1)',
                                         border: `1px solid ${hasError ? 'rgba(244,63,94,0.3)' : 'rgba(6,214,160,0.3)'}`,
                                     }}>
                                    {_MSG.map((msg, i) => (
                                        <p key={i} className={`text-sm flex items-center gap-2 ${hasError ? 'text-red-400' : 'text-emerald-400'}`}>
                                            <i className={`fas ${hasError ? 'fa-exclamation-circle' : 'fa-check-circle'}`}></i> {msg}
                                        </p>
                                    ))}
                                </div>
                            )}

                            <div className="text-center mb-10">
                                <div className="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5"
                                     style={{background: 'linear-gradient(135deg, rgba(6,214,160,0.15), rgba(56,189,248,0.15))'}}>
                                    <i className="fas fa-sign-in-alt text-xl gradient-text"></i>
                                </div>
                                <h1 className="text-3xl font-black text-slate-100" style={{fontFamily: 'Outfit, sans-serif'}}>Welcome Back</h1>
                                <p className="text-sm text-slate-500 mt-2">Sign in to your MediFlow account</p>
                            </div>

                            <form action="" method="POST" className="space-y-5">
                                <input type="hidden" name="csrfmiddlewaretoken" value={_CSRF} />

                                {/* Email */}
                                <div>
                                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Email Address</label>
                                    <div className="relative mt-2">
                                        <i className={`fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-sm ${focusedField === 'email' ? 'text-cyan-400' : 'text-slate-600'} transition`}></i>
                                        <input type="email" name="email" placeholder="john@email.com"
                                               onFocus={() => setFocusedField('email')}
                                               onBlur={() => setFocusedField(null)}
                                               className="input-glass pl-11" required />
                                    </div>
                                </div>

                                {/* Password */}
                                <div>
                                    <label className="text-[10px] font-bold text-slate-500 uppercase tracking-widest ml-1">Password</label>
                                    <div className="relative mt-2">
                                        <i className={`fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-sm ${focusedField === 'password' ? 'text-cyan-400' : 'text-slate-600'} transition`}></i>
                                        <input type={showPass ? 'text' : 'password'} name="password" placeholder="••••••••"
                                               onFocus={() => setFocusedField('password')}
                                               onBlur={() => setFocusedField(null)}
                                               className="input-glass pl-11 pr-11" required />
                                        <button type="button" onClick={() => setShowPass(!showPass)}
                                                className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-cyan-400 transition bg-transparent border-none cursor-pointer">
                                            <i className={`fas ${showPass ? 'fa-eye-slash' : 'fa-eye'} text-sm`}></i>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" className="btn-primary w-full py-4 rounded-2xl text-base mt-2">
                                    <span>Sign In</span>
                                    <i className="fas fa-arrow-right ml-2 text-sm"></i>
                                </button>
                            </form>


                            <p className="text-center text-xs text-slate-600 mt-8">
                                Don't have an account?{' '}
                                <a href={_URLS.signup} className="text-cyan-400 font-bold no-underline hover:underline">Create Account</a>
                            </p>
                        </div>
                    </div>
                </main>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('login-root')).render(<LoginPage />);
    </script>
    {% endverbatim %}
</body>
</html>
