{% extends 'base.html' %}
{% block title %}Stress Analyzer | MediFlow{% endblock %}
{% block body %}

<div id="stress-root"></div>

{% verbatim %}
<script type="text/babel">
function StressAnalyzer() {
    const [selectedCards, setSelectedCards] = React.useState([]);
    const [analyzed, setAnalyzed]           = React.useState(false);
    const [stressScore, setStressScore]     = React.useState(0);
    const [animatedScore, setAnimatedScore] = React.useState(0);

    const questions = [
        { id: 1, icon: 'fa-moon',          title: 'Sleep Quality',    weight: 25, color: '#8b5cf6', desc: 'Did you wake up feeling rested or exhausted?'                       },
        { id: 2, icon: 'fa-brain',         title: 'Cognitive Load',   weight: 30, color: '#38bdf8', desc: 'Difficulty focusing or "brain fog" experienced today?'              },
        { id: 3, icon: 'fa-heart-pulse',   title: 'Physical Tension', weight: 20, color: '#f43f5e', desc: 'Tightness in shoulders, neck, or jaw?'                             },
        { id: 4, icon: 'fa-bolt-lightning',title: 'Irritability',     weight: 15, color: '#fb923c', desc: 'Lower patience levels than usual with minor tasks?'                },
        { id: 5, icon: 'fa-face-tired',    title: 'Energy Levels',    weight: 20, color: '#06d6a0', desc: 'Feeling drained despite adequate rest?'                            },
        { id: 6, icon: 'fa-utensils',      title: 'Appetite Changes', weight: 10, color: '#fbbf24', desc: 'Unusual eating patterns — over or under eating?'                   },
    ];

    const toggleCard  = (id) => { setSelectedCards(prev => prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]); setAnalyzed(false); };

    const analyzeStress = () => {
        const totalWeight = questions.filter(q => selectedCards.includes(q.id)).reduce((s, q) => s + q.weight, 0);
        const maxWeight   = questions.reduce((s, q) => s + q.weight, 0);
        const score       = Math.round((totalWeight / maxWeight) * 100);
        setStressScore(score);
        setAnalyzed(true);
        let current = 0;
        const timer = setInterval(() => {
            current += 2;
            if (current >= score) { setAnimatedScore(score); clearInterval(timer); }
            else setAnimatedScore(current);
        }, 20);
    };

    const getStressLevel = (score) => {
        if (score <= 25) return { label: 'Low',      color: '#34d399', desc: 'Your stress levels are well managed. Keep it up!'                    };
        if (score <= 50) return { label: 'Moderate', color: '#fbbf24', desc: 'Consider some relaxation techniques and mindfulness.'                };
        if (score <= 75) return { label: 'High',     color: '#fb923c', desc: 'Take a break. Consider deep breathing and a walk.'                   };
        return             { label: 'Critical', color: '#f43f5e', desc: 'Please prioritize rest. Consider professional support.'              };
    };

    const circumference  = 2 * Math.PI * 70;
    const strokeOffset   = circumference - (animatedScore / 100) * circumference;

    return (
        <main className="max-w-7xl mx-auto px-6 py-16">
            <div className="grid lg:grid-cols-2 gap-16 items-center mb-24">
                <div className="anim-slide-left">
                    <span className="badge badge-orange mb-6">Mental Wellness Module</span>
                    <h1 className="text-5xl font-black leading-tight mb-6" style={{fontFamily: 'Outfit, sans-serif'}}>
                        Quantify Your<br/><span className="gradient-text">Mental Performance</span>
                    </h1>
                    <p className="text-lg text-slate-400 leading-relaxed mb-8">
                        Stress isn't just a feeling — it's a physiological state. Our AI analyzes your behavioral patterns
                        and self-reported biometrics to determine your current cortisol risk levels.
                    </p>
                    <div className="flex items-center gap-6">
                        <div className="flex -space-x-3">
                            <div className="w-10 h-10 rounded-full border-2 flex items-center justify-center text-[10px] font-bold"
                                 style={{borderColor: 'var(--bg-primary)', background: 'rgba(148,163,184,0.2)', color: '#94a3b8'}}>JD</div>
                            <div className="w-10 h-10 rounded-full border-2 flex items-center justify-center text-[10px] font-bold"
                                 style={{borderColor: 'var(--bg-primary)', background: 'rgba(56,189,248,0.2)', color: '#38bdf8'}}>AI</div>
                            <div className="w-10 h-10 rounded-full border-2 flex items-center justify-center"
                                 style={{borderColor: 'var(--bg-primary)', background: 'rgba(148,163,184,0.3)'}}>
                                <i className="fas fa-plus text-[8px] text-slate-400"></i>
                            </div>
                        </div>
                        <p className="text-xs text-slate-500">Used by <span className="text-slate-200 font-bold">2,400+ users</span> for mental health tracking.</p>
                    </div>
                </div>

                <div className="anim-slide-right anim-delay-200">
                    <div className="glass-card p-8 rounded-3xl" style={{cursor: 'default'}}>
                        <div className="flex justify-between items-center mb-10">
                            <h3 className="font-bold text-slate-200">Stress Level Radar</h3>
                            <span className="badge text-[9px] px-2 py-1" style={{
                                background: analyzed ? 'rgba(6,214,160,0.12)' : 'rgba(148,163,184,0.12)',
                                color: analyzed ? '#06d6a0' : '#94a3b8',
                                border: `1px solid ${analyzed ? 'rgba(6,214,160,0.2)' : 'rgba(148,163,184,0.2)'}`
                            }}>
                                {analyzed ? 'ANALYZED' : 'AWAITING INPUT'}
                            </span>
                        </div>
                        <div className="flex justify-center">
                            <div className="relative w-48 h-48">
                                <svg className="w-48 h-48 -rotate-90" viewBox="0 0 160 160">
                                    <circle cx="80" cy="80" r="70" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="8"/>
                                    <circle cx="80" cy="80" r="70" fill="none"
                                            stroke={analyzed ? getStressLevel(stressScore).color : 'rgba(56,189,248,0.2)'}
                                            strokeWidth="8" strokeLinecap="round"
                                            strokeDasharray={circumference}
                                            strokeDashoffset={analyzed ? strokeOffset : circumference}
                                            style={{transition: 'stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1)'}}/>
                                </svg>
                                <div className="absolute inset-0 flex flex-col items-center justify-center">
                                    <span className="text-4xl font-black" style={{color: analyzed ? getStressLevel(stressScore).color : '#94a3b8'}}>
                                        {analyzed ? animatedScore : '—'}%
                                    </span>
                                    <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">
                                        {analyzed ? getStressLevel(stressScore).label : 'Baseline'}
                                    </p>
                                </div>
                            </div>
                        </div>
                        {analyzed && (
                            <div className="mt-6 p-4 rounded-xl text-center text-sm"
                                 style={{background: `${getStressLevel(stressScore).color}10`, border: `1px solid ${getStressLevel(stressScore).color}20`, color: getStressLevel(stressScore).color}}>
                                {getStressLevel(stressScore).desc}
                            </div>
                        )}
                    </div>
                </div>
            </div>

            <section className="glass-card p-12 rounded-3xl anim-fade-in-up" style={{cursor: 'default'}}>
                <div className="max-w-4xl mx-auto">
                    <div className="text-center mb-12">
                        <h2 className="text-3xl font-bold text-slate-100 mb-2" style={{fontFamily: 'Outfit, sans-serif'}}>Quick Assessment</h2>
                        <p className="text-slate-500 italic">Select the cards that best describe your last 24 hours</p>
                    </div>
                    <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                        {questions.map((q) => (
                            <div key={q.id}
                                 className={`assessment-option p-6 rounded-2xl cursor-pointer ${selectedCards.includes(q.id) ? 'active' : ''}`}
                                 onClick={() => toggleCard(q.id)}>
                                <div className="flex justify-between items-start mb-4">
                                    <div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{background: `${q.color}15`}}>
                                        <i className={`fas ${q.icon}`} style={{color: q.color}}></i>
                                    </div>
                                    <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition ${selectedCards.includes(q.id) ? 'border-cyan-400 bg-cyan-400/20' : 'border-slate-700'}`}>
                                        {selectedCards.includes(q.id) && <i className="fas fa-check text-[8px] text-cyan-400"></i>}
                                    </div>
                                </div>
                                <h4 className="font-bold text-slate-200 mb-2">{q.title}</h4>
                                <p className="text-xs text-slate-500">{q.desc}</p>
                            </div>
                        ))}
                    </div>
                    <button onClick={analyzeStress} disabled={selectedCards.length === 0}
                            className="btn-primary w-full py-5 rounded-2xl text-base font-bold disabled:opacity-30 disabled:cursor-not-allowed">
                        <span>Analyze Mental Exhaustion <i className="fas fa-arrow-right ml-2"></i></span>
                    </button>
                </div>
            </section>
        </main>
    );
}

const stressRoot = ReactDOM.createRoot(document.getElementById('stress-root'));
stressRoot.render(<StressAnalyzer />);
</script>
{% endverbatim %}

{% endblock %}
